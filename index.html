<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>部門損益實績分析系統</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d0f14;
  --bg2: #13161e;
  --bg3: #1a1e28;
  --border: #252a38;
  --border2: #2f3547;
  --accent: #4f9cf9;
  --accent2: #7b61ff;
  --green: #22c55e;
  --red: #ef4444;
  --yellow: #f59e0b;
  --text: #e2e8f0;
  --text2: #94a3b8;
  --text3: #4a5568;
  --mono: 'DM Mono', monospace;
  --sans: 'Noto Sans TC', sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--sans); min-height: 100vh; }

/* ── HEADER ── */
header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 32px; height: 60px;
  background: var(--bg2); border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 100;
}
.logo { display: flex; align-items: center; gap: 10px; }
.logo-mark {
  width: 32px; height: 32px; border-radius: 8px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
}
.logo-text { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
.logo-sub { font-size: 11px; color: var(--text2); font-weight: 300; }

/* ── NAV TABS ── */
.nav-tabs { display: flex; gap: 4px; }
.tab-btn {
  padding: 6px 18px; border-radius: 6px; border: none;
  background: transparent; color: var(--text2);
  font-family: var(--sans); font-size: 13px; cursor: pointer;
  transition: all 0.2s;
}
.tab-btn:hover { color: var(--text); background: var(--bg3); }
.tab-btn.active { background: var(--accent); color: #fff; font-weight: 500; }

/* ── MAIN ── */
main { padding: 28px 32px; max-width: 1400px; margin: 0 auto; }
.page { display: none; }
.page.active { display: block; }

/* ── SECTION TITLE ── */
.section-title {
  font-size: 20px; font-weight: 700; margin-bottom: 6px;
  display: flex; align-items: center; gap: 8px;
}
.section-title span { color: var(--accent); }
.section-sub { font-size: 13px; color: var(--text2); margin-bottom: 24px; }

/* ── CARDS ── */
.card {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 12px; padding: 24px;
}
.card-title { font-size: 13px; font-weight: 500; color: var(--text2); margin-bottom: 16px; text-transform: uppercase; letter-spacing: 0.08em; }

/* ── UPLOAD AREA ── */
.upload-grid { display: grid; grid-template-columns: 1fr 360px; gap: 20px; margin-bottom: 20px; }
.drop-zone {
  border: 2px dashed var(--border2); border-radius: 10px;
  padding: 48px 32px; text-align: center; cursor: pointer;
  transition: all 0.2s; position: relative;
}
.drop-zone:hover, .drop-zone.drag { border-color: var(--accent); background: rgba(79,156,249,0.04); }
.drop-zone input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.drop-icon { font-size: 40px; margin-bottom: 12px; }
.drop-label { font-size: 15px; font-weight: 500; margin-bottom: 6px; }
.drop-hint { font-size: 12px; color: var(--text2); }
.drop-filename { font-size: 13px; color: var(--green); margin-top: 10px; font-family: var(--mono); }

.config-card { display: flex; flex-direction: column; gap: 16px; }
.form-group label { font-size: 12px; color: var(--text2); display: block; margin-bottom: 6px; }
.form-group input, .form-group select {
  width: 100%; padding: 10px 14px;
  background: var(--bg3); border: 1px solid var(--border2);
  border-radius: 8px; color: var(--text); font-family: var(--mono);
  font-size: 13px; outline: none; transition: border 0.2s;
}
.form-group input:focus, .form-group select:focus { border-color: var(--accent); }

.btn {
  padding: 11px 24px; border-radius: 8px; border: none;
  font-family: var(--sans); font-size: 14px; font-weight: 600;
  cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 8px;
}
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: #3b8ef0; transform: translateY(-1px); }
.btn-primary:disabled { background: var(--border2); color: var(--text3); cursor: not-allowed; transform: none; }
.btn-green { background: var(--green); color: #fff; }
.btn-green:hover { background: #16a34a; }
.btn-outline { background: transparent; color: var(--text2); border: 1px solid var(--border2); }
.btn-outline:hover { border-color: var(--accent); color: var(--accent); }

/* ── PROGRESS ── */
.progress-wrap { margin: 16px 0; display: none; }
.progress-bar { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
.progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); width: 0; transition: width 0.3s; border-radius: 2px; }
.progress-label { font-size: 12px; color: var(--text2); margin-top: 6px; font-family: var(--mono); }

/* ── RESULT SUMMARY ── */
.result-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
.stat-card {
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: 10px; padding: 16px 20px;
}
.stat-label { font-size: 11px; color: var(--text2); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.06em; }
.stat-value { font-size: 22px; font-weight: 700; font-family: var(--mono); }
.stat-value.pos { color: var(--green); }
.stat-value.neg { color: var(--red); }
.stat-value.neu { color: var(--accent); }

/* ── DEPT TABLE ── */
.dept-table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
thead th {
  padding: 10px 14px; text-align: right; font-size: 11px;
  color: var(--text2); text-transform: uppercase; letter-spacing: 0.06em;
  border-bottom: 1px solid var(--border); font-weight: 500;
}
thead th:first-child { text-align: left; }
tbody tr { border-bottom: 1px solid var(--border); transition: background 0.15s; }
tbody tr:hover { background: var(--bg3); }
tbody td { padding: 10px 14px; text-align: right; font-family: var(--mono); }
tbody td:first-child { text-align: left; font-family: var(--sans); font-weight: 500; }
.val-pos { color: var(--green); }
.val-neg { color: var(--red); }
.val-zero { color: var(--text3); }
.total-row td { border-top: 2px solid var(--border2); font-weight: 700; color: var(--accent); }

/* ── DASHBOARD ── */
.dash-kpi { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 24px; }
.kpi-card {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 10px; padding: 18px 20px;
}
.kpi-dept { font-size: 11px; color: var(--text2); margin-bottom: 4px; }
.kpi-name { font-size: 12px; color: var(--text); margin-bottom: 10px; }
.kpi-val { font-size: 18px; font-weight: 700; font-family: var(--mono); }

.chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
.chart-full { grid-column: 1 / -1; }
.chart-wrap { position: relative; height: 300px; }
.chart-wrap-tall { position: relative; height: 380px; }

/* ── TREND ── */
.trend-uploads { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
.month-chip {
  display: flex; align-items: center; gap: 8px;
  background: var(--bg3); border: 1px solid var(--border2);
  border-radius: 20px; padding: 6px 14px; font-size: 12px;
}
.month-chip .remove { cursor: pointer; color: var(--text3); }
.month-chip .remove:hover { color: var(--red); }
.add-month-btn {
  background: transparent; border: 1px dashed var(--border2);
  border-radius: 20px; padding: 6px 14px; color: var(--text2);
  font-size: 12px; cursor: pointer; transition: all 0.2s;
}
.add-month-btn:hover { border-color: var(--accent); color: var(--accent); }

/* ── EMPTY STATE ── */
.empty-state {
  text-align: center; padding: 80px 32px; color: var(--text2);
}
.empty-icon { font-size: 48px; margin-bottom: 16px; opacity: 0.4; }
.empty-text { font-size: 15px; }

/* ── TOAST ── */
#toast {
  position: fixed; bottom: 24px; right: 24px;
  background: var(--bg3); border: 1px solid var(--border2);
  border-radius: 10px; padding: 14px 20px;
  font-size: 13px; display: none; z-index: 999;
  animation: slideUp 0.3s ease;
}
@keyframes slideUp { from { transform: translateY(10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

/* ── SCROLLBAR ── */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

.flex-row { display: flex; gap: 12px; align-items: center; }
.mt16 { margin-top: 16px; }
.gap-right { margin-right: auto; }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-mark">📊</div>
    <div>
      <div class="logo-text">部門損益實績分析</div>
      <div class="logo-sub">Department P&L Analytics</div>
    </div>
  </div>
  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('upload')">上傳分析</button>
    <button class="tab-btn" onclick="switchTab('dashboard')">損益儀表板</button>
    <button class="tab-btn" onclick="switchTab('trend')">趨勢比較</button>
  </div>
</header>

<main>

<!-- ══════════════════════════════════════
     PAGE 1：上傳分析
══════════════════════════════════════ -->
<div class="page active" id="page-upload">
  <div class="section-title">上傳<span>分析</span></div>
  <div class="section-sub">上傳文中系統匯出的月份分類帳，自動計算各部門損益並下載 Excel 報表</div>

  <div class="upload-grid">
    <div class="card">
      <div class="card-title">分類帳檔案</div>
      <div class="drop-zone" id="dropZone">
        <input type="file" id="fileInput" accept=".xls,.xlsx" onchange="handleFile(this.files[0])">
        <div class="drop-icon">📂</div>
        <div class="drop-label">拖曳或點擊上傳</div>
        <div class="drop-hint">支援 .XLS / .XLSX 格式</div>
        <div class="drop-filename" id="fileName"></div>
      </div>
    </div>

    <div class="card config-card">
      <div class="card-title">報表設定</div>
      <div class="form-group">
        <label>公司總庫存金額（負數）</label>
        <input type="text" id="totalInventory" placeholder="-1,140,651,351" value="">
      </div>
      <div class="form-group">
        <label>報表年月（民國）</label>
        <input type="text" id="reportMonth" placeholder="例：115年3月" value="">
      </div>
      <div class="form-group">
        <label>G100 差額補足部門</label>
        <select id="balanceDept">
          <option value="G100">G100 人資財會部</option>
        </select>
      </div>
      <button class="btn btn-primary" id="runBtn" onclick="runAnalysis()" disabled>
        ⚡ 開始分析
      </button>
    </div>
  </div>

  <div class="progress-wrap" id="progressWrap">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-label" id="progressLabel">讀取資料中...</div>
  </div>

  <div id="resultArea" style="display:none">
    <div class="result-grid" id="statsGrid"></div>
    <div class="card">
      <div class="flex-row" style="margin-bottom:16px">
        <div class="card-title gap-right" style="margin-bottom:0">各部門稅前損益摘要</div>
        <button class="btn btn-green" onclick="downloadExcel()">⬇ 下載 Excel 報表</button>
      </div>
      <div class="dept-table-wrap">
        <table id="summaryTable">
          <thead>
            <tr>
              <th style="text-align:left">部門</th>
              <th>營業收入</th>
              <th>營業毛利</th>
              <th>營業費用</th>
              <th>營業利益</th>
              <th>非營業收支</th>
              <th>稅前損益</th>
            </tr>
          </thead>
          <tbody id="summaryBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════════
     PAGE 2：損益儀表板
══════════════════════════════════════ -->
<div class="page" id="page-dashboard">
  <div class="section-title">損益<span>儀表板</span></div>
  <div class="section-sub">視覺化各部門損益結構，請先在「上傳分析」頁面完成分析</div>
  <div id="dashContent">
    <div class="empty-state">
      <div class="empty-icon">📈</div>
      <div class="empty-text">尚無資料，請先上傳並分析分類帳</div>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════════
     PAGE 3：趨勢比較
══════════════════════════════════════ -->
<div class="page" id="page-trend">
  <div class="section-title">趨勢<span>比較</span></div>
  <div class="section-sub">上傳多個月份資料，比較各部門損益趨勢變化</div>

  <div class="card" style="margin-bottom:20px">
    <div class="card-title">已載入月份</div>
    <div class="trend-uploads" id="monthChips">
      <button class="add-month-btn" onclick="document.getElementById('trendFileInput').click()">＋ 新增月份</button>
    </div>
    <input type="file" id="trendFileInput" accept=".xls,.xlsx" style="display:none" onchange="addTrendFile(this)">
    <div class="flex-row mt16" id="trendConfig" style="display:none">
      <div class="form-group" style="flex:1">
        <label>本月公司總庫存（新增月份用）</label>
        <input type="text" id="trendInventory" placeholder="-1,140,651,351">
      </div>
      <div class="form-group" style="flex:1">
        <label>年月標籤</label>
        <input type="text" id="trendLabel" placeholder="例：115年3月">
      </div>
      <button class="btn btn-primary mt16" onclick="confirmAddTrend()" style="align-self:flex-end">確認加入</button>
    </div>
  </div>

  <div id="trendContent">
    <div class="empty-state">
      <div class="empty-icon">📉</div>
      <div class="empty-text">請上傳至少 2 個月份的資料</div>
    </div>
  </div>
</div>

</main>

<div id="toast"></div>

<script>
// ════════════════════════════════════════
// 全域資料
// ════════════════════════════════════════
let currentData = null;      // 最新一次分析結果
let trendDatasets = [];      // 多月份資料 [{label, pl, depts}]
let pendingTrendFile = null; // 暫存待確認的趨勢檔
let chartInstances = {};     // Chart.js instances

const DEPT_NAMES = {
  'M100':'商品發展部','E100':'EC發展部','E200':'EC業務部',
  'C100':'盤點中心一部','C200':'盤點中心二部','C300':'盤點業務部',
  'L100':'北區營運部','L200':'物流推進整合部','L300':'中南區營運部',
  'S100':'綜合服務部','G100':'人資財會部','I100':'資訊TEAM',
  'I200':'設備工程部','H100':'數位賦能室','M200':'商品企劃部',
  'B100':'總經理室','Z100':'勞工安全檢查室'
};

// ════════════════════════════════════════
// TAB 切換
// ════════════════════════════════════════
function switchTab(name) {
  document.querySelectorAll('.tab-btn').forEach((b,i) => {
    const tabs = ['upload','dashboard','trend'];
    b.classList.toggle('active', tabs[i] === name);
  });
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  if (name === 'dashboard' && currentData) renderDashboard();
  if (name === 'trend' && trendDatasets.length >= 2) renderTrend();
}

// ════════════════════════════════════════
// 檔案拖曳
// ════════════════════════════════════════
const dz = document.getElementById('dropZone');
dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('drag'); });
dz.addEventListener('dragleave', () => dz.classList.remove('drag'));
dz.addEventListener('drop', e => {
  e.preventDefault(); dz.classList.remove('drag');
  if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
});

function handleFile(file) {
  if (!file) return;
  document.getElementById('fileName').textContent = '✓ ' + file.name;
  document.getElementById('runBtn').disabled = false;
  window._pendingFile = file;
  showToast('📂 已載入：' + file.name);
}

// ════════════════════════════════════════
// 核心：解析分類帳
// ════════════════════════════════════════
function parseJournal(data, totalInventory) {
  const wb = XLSX.read(data, { type: 'array' });
  const ws = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(ws, { defval: '' });

  // 欄位名稱對應（容錯）
  const keys = Object.keys(rows[0] || {});
  const COL = {
    acct: keys.find(k => k.includes('會計項目')) || '會計項目',
    name: keys.find(k => k.includes('項目名稱')) || '項目名稱(借/貸)',
    date: keys.find(k => k.includes('日期')) || '日期',
    voucher: keys.find(k => k.includes('傳票')) || '傳票號碼',
    vendor: keys.find(k => k.includes('客供商')) || '客供商代號',
    summary: keys.find(k => k.includes('摘要')) || '摘要',
    debit: keys.find(k => k.includes('借方金額')) || '借方金額',
    credit: keys.find(k => k.includes('貸方金額')) || '貸方金額',
  };

  // 部門清單：從分類帳動態偵測
  const deptSet = new Set();
  const deptRe = /\b([A-Z]\d{3})\b/;
  rows.forEach(r => {
    const s = String(r[COL.summary] || '').trim();
    if (s.length >= 4) {
      const head = s.slice(0,4);
      if (/^[A-Z]\d{3}$/.test(head)) deptSet.add(head);
    }
  });
  const DEPTS = [...deptSet].sort();
  const validDepts = new Set(DEPTS);

  function getDept(summary) {
    const s = String(summary || '').trim();
    // 銷貨成本結轉、進貨結轉 → SKIP（月底對沖分錄）
    if (/^(銷貨成本|油品銷貨成本|進貨結轉|油品進貨結轉|進貨退出結轉)[-－]\d{4}$/.test(s)) return 'SKIP';
    if (s.length >= 4 && validDepts.has(s.slice(0,4))) return s.slice(0,4);
    const m = s.match(/\b([A-Z]\d{3})\b/);
    if (m && validDepts.has(m[1])) return m[1];
    return null;
  }

  // 加總
  const acctData = {};
  const acctNames = {};
  const ledgerRows = {};
  DEPTS.forEach(d => { acctData[d] = {}; ledgerRows[d] = {}; });

  rows.forEach(r => {
    const acct = String(r[COL.acct] || '').trim();
    if (!acct || acct === 'nan') return;
    const rawName = String(r[COL.name] || '');
    if (rawName) acctNames[acct] = rawName.replace(/[（(][借貸][）)]/g,'').trim();
    const dept = getDept(r[COL.summary]);
    if (!dept || dept === 'SKIP' || !validDepts.has(dept)) return;
    if (!acctData[dept][acct]) acctData[dept][acct] = { debit: 0, credit: 0 };
    acctData[dept][acct].debit  += parseFloat(r[COL.debit]  || 0);
    acctData[dept][acct].credit += parseFloat(r[COL.credit] || 0);
    if (!ledgerRows[dept][acct]) ledgerRows[dept][acct] = [];
    ledgerRows[dept][acct].push(r);
  });

  function nc(d,a){ const x=acctData[d]?.[a]||{debit:0,credit:0}; return x.credit-x.debit; }
  function nd(d,a){ const x=acctData[d]?.[a]||{debit:0,credit:0}; return x.debit-x.credit; }
  function gd(d,a){ return acctData[d]?.[a]?.debit||0; }

  // 存貨
  const inventory = {}; const cogsAdj = {};
  DEPTS.forEach(d => {
    if (d === 'G100') return;
    // 先計算 cogsAdj（5150），再算期末存貨
    const adj_5150 = nd(d,'5150');
    cogsAdj[d] = adj_5150;
    
    // 情況A：有進貨 → 期末 = 銷貨收入淨額 - (進貨 - 退出 - 調整)
    //   調整要取反號：nd('5150')=-1,722,864 → 在公式中用 -adj_5150 = +1,722,864
    if (gd(d,'5100') > 0) {
      const revNet = nc(d,'4100') + nc(d,'4110');
      const purch = gd(d,'5100');
      const ret = nc(d,'5110');
      inventory[d] = revNet - (purch - ret - adj_5150);
    } 
    // 情況B：無進貨但有5150 → 期末=5150，調整=5150（互抵）
    else if (adj_5150 !== 0) {
      inventory[d] = adj_5150;
    } 
    // 情況C：無進貨無5150
    else {
      inventory[d] = 0;
    }
  });
  const othersSum = DEPTS.filter(d=>d!=='G100').reduce((s,d)=>s+(inventory[d]||0),0);
  inventory['G100'] = totalInventory - othersSum;
  cogsAdj['G100'] = 0;

  // 損益
  function calcPL(dept) {
    const rev4100=nc(dept,'4100'), rev4110=nc(dept,'4110'), revNet=rev4100+rev4110;
    const revLogistics=nc(dept,'4101001'), revOtherDel=nc(dept,'4101007');
    const revTransfer=nc(dept,'4101099'), revService=nc(dept,'4101009');
    const revEC=nc(dept,'4101010');
    const revBonusMonthly=nc(dept,'4101003');
    const revBonusInfo=nc(dept,'4101004');
    const revBonusPromo=nc(dept,'4101006');
    const revBonusAnnual=nc(dept,'4101008');
    const revBonus=revBonusMonthly+revBonusInfo+revBonusPromo+revBonusAnnual;
    const revTotal=revNet+revLogistics+revOtherDel+revTransfer+revService+revEC+revBonus;

    const invBegin = dept==='G100' ? -(inventory[dept]||0) : 0;
    const purchase = gd(dept,'5100');
    const purchaseReturn = -nc(dept,'5110');
    const invEnd = inventory[dept]||0;

    const costPack=nd(dept,'5101001'), costFreight=nd(dept,'5101007');
    const costBonusFam=nd(dept,'5101011'), costBonusLf=nd(dept,'5101012');
    const costBonusOK=nd(dept,'5101016'), costBonusOther=nd(dept,'5101013');
    const costSalaryDispatch=nd(dept,'5101088');
    const costSalaryHour=nd(dept,'5101090');
    const costSalaryOT=nd(dept,'5101091');
    const costSalaryLabor=nd(dept,'5101092');
    const costSalaryHealth=nd(dept,'5101093');
    const costSalaryGroup=nd(dept,'5101094');
    const costSalaryRetire=nd(dept,'5101095');
    const costSalaryMeal=nd(dept,'5101096');
    const costSalaryBonus=nd(dept,'5101097');
    const costSalaries=costSalaryDispatch+costSalaryHour+costSalaryOT+costSalaryLabor+
      costSalaryHealth+costSalaryGroup+costSalaryRetire+costSalaryMeal+costSalaryBonus;
    const costOther=nd(dept,'5101099');
    const cogsAdj_val = cogsAdj[dept]||0;
    const cogsVal=invBegin+purchase+purchaseReturn+invEnd+costPack+costFreight+
      costBonusFam+costBonusLf+costBonusOK+costBonusOther+
      costSalaryDispatch+costSalaryHour+costSalaryOT+costSalaryLabor+
      costSalaryHealth+costSalaryGroup+costSalaryRetire+costSalaryMeal+costSalaryBonus+costOther;
    const gross = revTotal - cogsVal;

    const expPersonnel=
      nd(dept,'6010')+nd(dept,'6013')+nd(dept,'6235')+nd(dept,'6558')+nd(dept,'6180')+
      nd(dept,'6100001')+nd(dept,'6100002')+nd(dept,'6100003')+nd(dept,'6190')+
      nd(dept,'6560')+nd(dept,'6220')+nd(dept,'6225');
    const expFacility=nd(dept,'6020')+nd(dept,'6150')+nd(dept,'6160')+nd(dept,'6070');
    const expGeneral=nd(dept,'6090')+nd(dept,'6470')+nd(dept,'6552')+nd(dept,'6060')+
      nd(dept,'6100004')+nd(dept,'6050')+nd(dept,'6040')+nd(dept,'6310')+nd(dept,'6080');
    const expOther=nd(dept,'6110')+nd(dept,'6030001')+nd(dept,'6390')+nd(dept,'6551')+
      nd(dept,'6450')+nd(dept,'6130')+nd(dept,'6280');
    const expTotal=expPersonnel+expFacility+expGeneral+expOther;
    const opIncome=gross-expTotal;

    const nonRevTotal=nc(dept,'7040')+nc(dept,'7100')+nc(dept,'7030');
    const nonExp=nd(dept,'8010')+nd(dept,'8070');
    const nonNet=nonRevTotal-nonExp;
    const ebt=opIncome+nonNet;

    return { revTotal, revNet, revLogistics, revOtherDel, revTransfer, revService, revEC, revBonus,
             revBonusMonthly, revBonusInfo, revBonusPromo, revBonusAnnual,
             invBegin, purchase, purchaseReturn, invEnd, cogsAdj: cogsAdj[dept],
             costPack, costFreight, costBonusFam, costBonusLf, costBonusOK, costBonusOther,
             costSalaryDispatch, costSalaryHour, costSalaryOT, costSalaryLabor,
             costSalaryHealth, costSalaryGroup, costSalaryRetire, costSalaryMeal, costSalaryBonus,
             costSalaries, costOther, cogsVal, gross,
             expPersonnel, expFacility, expGeneral, expOther, expTotal,
             opIncome, nonRevTotal, nonExp, nonNet, ebt,
             // 細項
             rev4100, rev4110,
             expSalary:nd(dept,'6010'), expEmpReward:nd(dept,'6013'),
             expOT:nd(dept,'6235'), expYearBonus:nd(dept,'6558'), expMeal:nd(dept,'6180'),
             expLabor:nd(dept,'6100001'), expHealth:nd(dept,'6100002'), expGroup:nd(dept,'6100003'),
             expWelfare:nd(dept,'6190'), expRetire:nd(dept,'6560'), expTrain:nd(dept,'6220'),
             expRecruit:nd(dept,'6225'),
             expRent:nd(dept,'6020'), expDep:nd(dept,'6150'), expAmort:nd(dept,'6160'), expRepair:nd(dept,'6070'),
             expUtil:nd(dept,'6090'), expClean:nd(dept,'6470'), expSec:nd(dept,'6552'),
             expPost:nd(dept,'6060'), expIns:nd(dept,'6100004'), expFreight:nd(dept,'6050'),
             expTravel:nd(dept,'6040'), expVehicle:nd(dept,'6310'), expAdv:nd(dept,'6080'),
             expEntertain:nd(dept,'6110'), expStat:nd(dept,'6030001'), expLaborFee:nd(dept,'6390'),
             expMisc:nd(dept,'6551'), expDonat:nd(dept,'6450'), expTax:nd(dept,'6130'), expRoyal:nd(dept,'6280'),
             nonInterest:nc(dept,'7040'), nonOther:nc(dept,'7100'), nonRent:nc(dept,'7030'),
           };
  }

  const pl = {};
  DEPTS.forEach(d => pl[d] = calcPL(d));

  return { DEPTS, pl, inventory, cogsAdj, acctData, acctNames, ledgerRows, COL, rows };
}

// ════════════════════════════════════════
// 執行分析
// ════════════════════════════════════════
function runAnalysis() {
  const file = window._pendingFile;
  if (!file) { showToast('請先上傳分類帳檔案'); return; }
  const invRaw = document.getElementById('totalInventory').value.replace(/,/g,'');
  const totalInventory = parseFloat(invRaw);
  if (isNaN(totalInventory)) { showToast('❌ 請輸入有效的庫存金額'); return; }

  setProgress(true, 10, '讀取檔案中...');
  const reader = new FileReader();
  reader.onload = e => {
    try {
      setProgress(true, 40, '解析分類帳資料...');
      const data = new Uint8Array(e.target.result);
      setProgress(true, 70, '計算各部門損益...');
      const result = parseJournal(data, totalInventory);
      result.reportMonth = document.getElementById('reportMonth').value || '本期';
      currentData = result;
      setProgress(true, 95, '產生報表...');
      setTimeout(() => {
        setProgress(false);
        renderSummary(result);
        showToast('✅ 分析完成！共 ' + result.DEPTS.length + ' 個部門');
      }, 300);
    } catch(err) {
      setProgress(false);
      showToast('❌ 分析失敗：' + err.message);
      console.error('完整錯誤:', err);
      console.error('錯誤堆疊:', err.stack);
      alert('分析失敗！請按F12開啟開發者工具查看Console錯誤訊息。\n\n錯誤：' + err.message + '\n\n堆疊：' + (err.stack||'無'));
    }
  };
  reader.readAsArrayBuffer(file);
}

function setProgress(show, pct, label) {
  const wrap = document.getElementById('progressWrap');
  wrap.style.display = show ? 'block' : 'none';
  document.getElementById('progressFill').style.width = (pct||0) + '%';
  document.getElementById('progressLabel').textContent = label || '';
}

function renderSummary(data) {
  const { DEPTS, pl } = data;
  document.getElementById('resultArea').style.display = 'block';

  // KPI 統計
  const totalEbt = DEPTS.reduce((s,d) => s + pl[d].ebt, 0);
  const totalRev = DEPTS.reduce((s,d) => s + pl[d].revTotal, 0);
  const profitDepts = DEPTS.filter(d => pl[d].ebt > 0).length;
  const lossDepts = DEPTS.filter(d => pl[d].ebt < 0).length;

  document.getElementById('statsGrid').innerHTML = `
    <div class="stat-card"><div class="stat-label">全公司稅前損益</div>
      <div class="stat-value ${totalEbt>=0?'pos':'neg'}">${fmt(totalEbt)}</div></div>
    <div class="stat-card"><div class="stat-label">營業收入合計</div>
      <div class="stat-value neu">${fmt(totalRev)}</div></div>
    <div class="stat-card"><div class="stat-label">獲利部門</div>
      <div class="stat-value pos">${profitDepts} 個</div></div>
    <div class="stat-card"><div class="stat-label">虧損部門</div>
      <div class="stat-value neg">${lossDepts} 個</div></div>
  `;

  // 部門表格
  let html = '';
  DEPTS.forEach(d => {
    const p = pl[d];
    html += `<tr>
      <td>${d} ${DEPT_NAMES[d]||''}</td>
      <td class="${valClass(p.revTotal)}">${fmt(p.revTotal)}</td>
      <td class="${valClass(p.gross)}">${fmt(p.gross)}</td>
      <td class="${valClass(p.expTotal)}">${fmt(p.expTotal)}</td>
      <td class="${valClass(p.opIncome)}">${fmt(p.opIncome)}</td>
      <td class="${valClass(p.nonNet)}">${fmt(p.nonNet)}</td>
      <td class="${valClass(p.ebt)}">${fmt(p.ebt)}</td>
    </tr>`;
  });
  const totals = {
    rev: DEPTS.reduce((s,d)=>s+pl[d].revTotal,0),
    gross: DEPTS.reduce((s,d)=>s+pl[d].gross,0),
    exp: DEPTS.reduce((s,d)=>s+pl[d].expTotal,0),
    op: DEPTS.reduce((s,d)=>s+pl[d].opIncome,0),
    non: DEPTS.reduce((s,d)=>s+pl[d].nonNet,0),
    ebt: DEPTS.reduce((s,d)=>s+pl[d].ebt,0),
  };
  html += `<tr class="total-row">
    <td>全公司合計</td>
    <td>${fmt(totals.rev)}</td><td>${fmt(totals.gross)}</td>
    <td>${fmt(totals.exp)}</td><td>${fmt(totals.op)}</td>
    <td>${fmt(totals.non)}</td><td>${fmt(totals.ebt)}</td>
  </tr>`;
  document.getElementById('summaryBody').innerHTML = html;
}

let _trendRawData = null;

function addTrendFile(input) {
  const file = input.files[0]; if (!file) return;
  _trendRawData = file;
  document.getElementById('trendLabel').value = '';
  document.getElementById('trendInventory').value = '';
  document.getElementById('trendConfig').style.display = 'flex';
  showToast('📂 已選取：' + file.name + '，請填寫設定後確認加入');
  input.value = '';
}

function confirmAddTrend() {
  const invRaw = document.getElementById('trendInventory').value.replace(/,/g,'');
  const label  = document.getElementById('trendLabel').value.trim();
  const totalInventory = parseFloat(invRaw);
  if (!_trendRawData) { showToast('請先選擇檔案'); return; }
  if (isNaN(totalInventory)) { showToast('❌ 請輸入有效的庫存金額'); return; }
  if (!label) { showToast('❌ 請輸入年月標籤'); return; }
  if (trendDatasets.find(d => d.label === label)) { showToast('❌ 此月份已存在'); return; }

  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = parseJournal(new Uint8Array(e.target.result), totalInventory);
      trendDatasets.push({ label, pl: data.pl, depts: data.DEPTS });
      trendDatasets.sort((a,b) => a.label.localeCompare(b.label));
      renderMonthChips();
      document.getElementById('trendConfig').style.display = 'none';
      _trendRawData = null;
      if (trendDatasets.length >= 2) renderTrend();
      showToast('✅ 已加入：' + label);
    } catch(err) {
      showToast('❌ 解析失敗：' + err.message);
    }
  };
  reader.readAsArrayBuffer(_trendRawData);
}

function removeTrendMonth(label) {
  trendDatasets = trendDatasets.filter(d => d.label !== label);
  renderMonthChips();
  if (trendDatasets.length >= 2) renderTrend();
  else document.getElementById('trendContent').innerHTML = `
    <div class="empty-state"><div class="empty-icon">📉</div>
    <div class="empty-text">請上傳至少 2 個月份的資料</div></div>`;
}

function renderMonthChips() {
  const chips = trendDatasets.map(d => `
    <div class="month-chip">
      📅 ${d.label}
      <span class="remove" onclick="removeTrendMonth('${d.label}')">✕</span>
    </div>`).join('');
  document.getElementById('monthChips').innerHTML =
    chips + `<button class="add-month-btn" onclick="document.getElementById('trendFileInput').click()">＋ 新增月份</button>`;
}

function renderTrend() {
  if (trendDatasets.length < 2) return;

  const aoa_sys = [
    [`${reportMonth} 各部門損益彙整表（輸入格式）`],
    ['單位：新台幣元'],
    sys_hdr,
  ];

    const row_sys = [dept, DEPT_NAMES[dept]||dept, ...ACCT_DEF_SORTED.map(([acct,label,cat,sub,fn]) => fn(dept))];
    aoa_sys.push(row_sys);
  });

  const total_sys = ['合計', '全公司', ...ACCT_DEF_SORTED.map(([acct,label,cat,sub,fn]) => DEPTS.reduce((s,d)=>s+fn(d),0))];
  aoa_sys.push(total_sys);
  const ws_sys = XLSX.utils.aoa_to_sheet(aoa_sys);
  ws_sys['!cols'] = [{wch:10},{wch:14}, ...ACCT_DEF_SORTED.map(()=>({wch:14}))];
  XLSX.utils.book_append_sheet(wb, ws_sys, '📥輸入至系統');

  // ════════════════════════════════
  // 工作表2：明細流水格式（部門|科目代號|科目名稱|類別|小類|金額）
  // 方便串接實績系統（Long format）
  // ════════════════════════════════
  const aoa2 = [['年月','部門代號','部門名稱','科目代號','科目名稱','類別','小類','金額']];
  const ym = reportMonth || '';
  DEPTS.forEach(dept => {
    ACCT_DEF.forEach(([acct, label, cat, sub, fn]) => {

          d||'', c||'', '']);

      { const diff = /^[47]/.test(acct) ? tc-td : td-tc; aoa3.push([dept,'','',acct,'★'+(acctNames[acct]||'')+'【小計】','','',td,tc,diff]); }
    });

  const ws3 = XLSX.utils.aoa_to_sheet(aoa3);

  // ════════════════════════════════

  DEPTS.forEach(dept => {

  // ════════════════════════════════
  // 套用格式：千分位(cell.z) + 小計行標記
  // ════════════════════════════════
  const NUM_FMT = '#,##0;(#,##0);-';

  const YELLOW_FILL = { patternType: 'solid', fgColor: { rgb: 'FFFF99' } };

  function applyNumFmt(sheet, numColStart, numColEnd, highlightKeyword) {
    if (!sheet['!ref']) return;
    const range = XLSX.utils.decode_range(sheet['!ref']);
    for (let R = range.s.r; R <= range.e.r; R++) {
      // 判斷是否為小計行
      let isSubtotal = false;
      if (highlightKeyword) {
        for (let C = range.s.c; C <= range.e.c; C++) {
          const cell = sheet[XLSX.utils.encode_cell({r:R,c:C})];
          if (cell && typeof cell.v === 'string' && cell.v.includes(highlightKeyword)) {
            isSubtotal = true; break;
          }
        }
      }
      for (let C = range.s.c; C <= range.e.c; C++) {
        const addr = XLSX.utils.encode_cell({r:R, c:C});
        let cell = sheet[addr];
        if (!cell && isSubtotal) {
          cell = {t:'z', v:''};
          sheet[addr] = cell;
        }
        if (!cell) continue;
        if (!cell.s) cell.s = {};
        // 小計行整列黃底
        if (isSubtotal) {
          cell.s.fill = YELLOW_FILL;
        }
        // 數字欄千分位
        if (C >= numColStart && C <= numColEnd && typeof cell.v === 'number') {
          cell.z = NUM_FMT;
          cell.s.numFmt = NUM_FMT;
          cell.t = 'n';
          if (isSubtotal) cell.s.fill = YELLOW_FILL;
        }
      }
    }
  }

  // 彙整損益表
  applyNumFmt(ws1, 2, 999);

  applyNumFmt(ws_sys, 2, 999);

  applyNumFmt(ws2, 7, 7);

  applyNumFmt(ws3, 7, 8, '★');
  // 各部門損益表
  wb.SheetNames.filter(n => n.startsWith('損益_')).forEach(n => applyNumFmt(wb.Sheets[n], 2, 2));
  // 各部門分類帳：借方(6)~差額(10)，★小計行黃底
  wb.SheetNames.filter(n => n.startsWith('分類帳_')).forEach(n => applyNumFmt(wb.Sheets[n], 6, 8, '★'));

    const fname = (reportMonth||'本期') + '_各部門損益彙整.xlsx';
  XLSX.writeFile(wb, fname);
  showToast('⬇ 已下載：' + fname);
}

// ════════════════════════════════════════
// 工具函數
// ════════════════════════════════════════
function fmt(v) {
  if (v === null || v === undefined) return '-';
  v = Math.round(v);
  if (v === 0) return '-';
  if (v < 0) return '(' + Math.abs(v).toLocaleString('zh-TW') + ')';
  return v.toLocaleString('zh-TW');
}
function fmtShort(v) {
  if (Math.abs(v) >= 1e8) return (v/1e8).toFixed(1) + '億';
  if (Math.abs(v) >= 1e4) return (v/1e4).toFixed(0) + '萬';
  return v.toLocaleString('zh-TW');
}
function valClass(v) {
  if (!v || v === 0) return 'val-zero';
  return v > 0 ? 'val-pos' : 'val-neg';
}
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.style.display = 'none', 3000);
}
</script>
